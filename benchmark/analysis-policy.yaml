version: "1.0.0"
policy_id: "BSH-EMPIRICAL-ANALYSIS-POLICY-V1"
description: "Política pré-congelada de decisão e integridade experimental para avaliação do BSH (Seções 1, 5, 8)"
frozen: true

thresholds:
  analysis:
    descriptive_min_base_tasks: 1
    inferential_min_base_tasks: 6
    correlation_min_eligible_pairs: 6
    evidence_strength:
      moderate_min_base_tasks: 6
      strong_min_base_tasks: 20
    zero_event_interval: "two-sided-wilson"
  significance_alpha: 0.05
  confidence_interval_level: 0.95

missing_data_policy:
  placeholder_handling: "FORBIDDEN"
  prohibited_values:
    - "unknown"
    - "a1b2c3d4e5"
    - "dummy"
    - "placeholder"
    - "?"
    - "N/A_PLACEHOLDER"
  suppression_rule: "RECORD_SUPPRESSED_WITH_REASON"
  fallback_estimation: "FORBIDDEN"
  default_rule: "Campos indisponíveis devem ser estritamente null sem extrapolações sintéticas."

comparability_rules:
  token_comparability:
    requirement: "REQUIRE_IDENTICAL_AGENT_MODEL_EFFORT_ADAPTER_RUNTIME_SCHEMA_AND_ACCOUNTING_VERSION"
    rule: "Quando algum identificador necessário está ausente, usar INDETERMINATE; quando difere, FALSE; quando todos são observados e iguais, TRUE."
  latency_comparability:
    requirement: "REQUIRE_IDENTICAL_EXECUTION_ENVIRONMENT"
    rule: "Latência deve ser medida sobre a mesma máquina física/virtual sob condições equivalentes."
  non_cached_tokens:
    rule: "Tokens não-cacheados só são elegíveis se reportados de forma independente e não-sintética pelo provedor."

validation_categories:
  HARD_FAIL:
    description: "Falha impeditiva absoluta de integridade de dados, aritmética ou proveniência."
    actions: ["ABORT_ANALYSIS", "FAIL_GATE"]
    items:
      - "ARITHMETIC_INCONSISTENCY"
      - "PROVENANCE_HASH_MISMATCH"
      - "PLACEHOLDER_IN_REAL_CAMPAIGN"
      - "UNCLASSIFIED_RUNS"
      - "TOTAL_RUNS_MISMATCH"
  PUBLICATION_BLOCK:
    description: "Falha de apresentação, diagramação visual ou seções vazias que impedem a publicação do relatório."
    actions: ["FAIL_PDF_PUBLICATION"]
    items:
      - "TABLE_MARGIN_OVERFLOW"
      - "EMPTY_EDITORIAL_SECTION"
      - "BROKEN_LATEX_REFERENCE"
      - "MISSING_EVIDENCE_IN_SECTION"
  WARNING:
    description: "Limitação metodológica declarada que não invalida os dados mas deve constar como ameaça à validade."
    actions: ["RECORD_THREAT_TO_VALIDITY"]
    items:
      - "SAMPLE_SIZE_BELOW_POWER"
      - "SINGLE_DOMAIN_EVALUATION"
      - "UNCACHED_TOKENS_EXCLUDED"
      - "SINGLE_AGENT_FAMILY"
