version: "1.0.0"
plan_id: "BSH-EMPIRICAL-ANALYSIS-PLAN-V1"
description: "Plano pré-congelado de análise empírica para avaliação experimental do BSH (Seções 1, 5, 8)"
frozen: true

estimands:
  primary:
    name: "WORKLOAD_TOKEN_REDUCTION"
    formula: "1.0 - (sum(TokensD) / sum(TokensA))"
    scope: "all_paired_comparable"
    description: "Razão das somas de tokens brutos observados em pares A × D com contabilidade comparável; não representa equivalência funcional."
  secondary:
    - name: "mean_of_ratios"
      formula: "mean(1.0 - (TokensD_i / TokensA_i))"
      scope: "valid_equivalent"
    - name: "median_of_ratios"
      formula: "median(1.0 - (TokensD_i / TokensA_i))"
      scope: "valid_equivalent"
    - name: "paired_token_difference"
      formula: "TokensA_i - TokensD_i"
      scope: "all_paired"

subsets:
  valid_equivalent:
    description: "Pares onde ambas as condições completaram a tarefa com equivalência comportamental comprovada."
    filter: "behavioralEquivalence == 'EQUIVALENTE' and taskType in ['valida_governada', 'valida', 'valid']"
  violating:
    description: "Tarefas violadoras onde a governança semântica atuou ou deveria ter atuado."
    filter: "taskType in ['violadora', 'violating']"
  all_paired:
    description: "Todas as tarefas com execuções pareadas completas nas condições comparadas."
    filter: "conditionA is not null and conditionD is not null"
  all_paired_comparable:
    description: "Pares A × D com totalTokens observado em ambos os lados e contabilidade de tokens comparável."
    filter: "conditionA is not null and conditionD is not null and totalTokensA is not null and totalTokensD is not null and tokenAccountingComparable == 'TRUE'"

metrics:
  token_efficiency:
    - workload_reduction_ratio
    - mean_of_ratios
    - median_of_ratios
    - token_overhead_ratio
    - net_token_benefit
    - net_token_benefit_percentage
  cost_accounting:
    - custo_por_entrega_funcional:
        description: "Tokens totais divididos pelo número de tarefas válidas com entrega de código funcional correto."
        denominator: "count(functionalCorrectness == true)"
    - custo_por_desfecho_experimental_correto:
        description: "Tokens totais divididos pelo número de desfechos experimentais corretos (entregas válidas + bloqueios/abstenções corretos)."
        denominator: "count(taskOutcomeCorrect == true)"
  latency:
    - mean_duration
    - median_duration
    - paired_latency_difference
    - latency_ratio
    - latency_impact_percentage
  governance:
    - avoided_violation_cost
    - prevention_rate
    - conflict_report_rate
    - enforcement_rate
    - false_block_rate
    - undetected_violation_rate

statistical_methods:
  bootstrap:
    iterations: 1000
    seed: 42
    alpha: 0.05
    confidence_level: 0.95
    method: "percentile"
  hypothesis_tests:
    paired_difference: "wilcoxon_or_sign_test"
    correlations:
      - method: "pearson"
      - method: "spearman"
  comparisons:
    - progressive_contrasts:
        - "A_vs_B"
        - "B_vs_C"
        - "C_vs_D"
    - primary_contrast:
        - "A_vs_D"

research_questions:
  - id: "RQ1_A"
    name: "Diferença de consumo bruto de tokens entre A e D"
  - id: "RQ1_B"
    name: "Diferença de consumo sob equivalência funcional entre A e D"
  - id: "RQ2"
    name: "Benefício computacional por componente do workload"
  - id: "RQ3"
    name: "Efeito observado das regras textuais A × B"
  - id: "RQ4"
    name: "Efeito observado da ontologia consultiva B × C"
  - id: "RQ5"
    name: "Efeito observado do BSH completo C × D e enforcement independente"
  - id: "RQ6"
    name: "Reconhecimento semântico de operações e shapes"
  - id: "RQ7"
    name: "Mecanismos de governança e desfechos"
  - id: "RQ8"
    name: "Relação entre diferenças de tokens e duração"
  - id: "RQ9"
    name: "Distribuição de economia e overhead por tarefa e categoria"
  - id: "RQ10"
    name: "Complementaridade entre testes técnicos e validade semântica"
  - id: "RQ11"
    name: "Independência do harness em relação à cooperação do agente"
