benchmark:
  name: agy-bsh-benchmark
  outputDirectory: benchmark/results
  maximumExecutions: 60
  randomizeExecutionOrder: true
  failFastOnInstrumentationError: true

agent:
  id: agy
  model: gemini-3.7-flash-medium
  reasoningEffort: medium
  adapter: agy
  executable: agy

  # Configuração alternativa para Codex
  #
  # id: codex
  # model: gpt-6-sol
  # reasoningEffort: low
  # adapter: codex
  # executable: codex

project:
  path: pilot/asset-management
  branch: master
  ontologyDomain: ativos

experiment:
  conditions:
    - A
    - B
    - C
    - D

  tasks:
    - G4
    - G5
    - G6
    - V6
    - V7
    - V8
    - V9
    - V10
    - V11
    - V12
    - V13
    - V14

  replications:
    enabled: true
    maximumAdditionalExecutions: 10

  smokeTest:
    enabled: true
    runs:
      - task: G4
        condition: A
      - task: G4
        condition: B
      - task: G4
        condition: C
      - task: G4
        condition: D
      - task: V6
        condition: A
      - task: V6
        condition: B
      - task: V6
        condition: C
      - task: V6
        condition: D

telemetry:
  collectTokens: true
  collectCachedTokens: true
  collectReasoningTokens: true
  collectDuration: true
  collectGitChanges: true
  collectOntologyQueries: true
  collectReportedConflicts: true
  collectEnforcementEvidence: true
  preserveRawTelemetry: true

statistics:
  confidenceLevel: 0.95
  bootstrapIterations: 10000
  randomSeed: 20260925
  clusterVariable: baseTaskId

reports:
  generateMarkdown: false
  generateLatex: true
  generatePdf: true
  generateCharts: true
  generateCsv: true
  generateJson: true

charts:
  vectorFormat: pdf
  rasterFormat: png
  dpi: 300
