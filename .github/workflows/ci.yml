name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
          cache: npm
      - run: npm ci
      - name: Install the sandbox runtime required by confinement tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm run quality
      - run: npm test
      - name: Semantic integration and E2E pipeline
        run: npm run test:e2e
      - name: Pack the verified pull request distribution
        run: |
          mkdir -p ci-distribution
          npm pack --ignore-scripts --pack-destination ci-distribution
          cd ci-distribution
          sha256sum *.tgz > SHA256SUMS
      - name: Preserve the verified distribution and checksums
        uses: actions/upload-artifact@v4
        with:
          name: bsh-verified-distribution
          path: ci-distribution/
