name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm test
      - name: Semantic integration and E2E pipeline
        run: npm run test:e2e
      - name: Pack the installable tarball
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
      - name: Compute checksums
        run: |
          cd release-assets
          sha256sum *.tgz > SHA256SUMS
      - name: Publish GitHub Release with the tarball
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tgz
            release-assets/SHA256SUMS
          generate_release_notes: true
      - name: Publish to npm (only when NPM_TOKEN is set)
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
